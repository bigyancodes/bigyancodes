name: Refresh Commit Catch

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate the original fishing animation
        run: node scripts/generate-commit-catch.mjs
        env:
          GITHUB_USER: ${{ github.repository_owner }}

      - name: Commit the refreshed animation
        shell: bash
        run: |
          if git diff --quiet -- assets/commit-catch.svg; then
            echo "Commit Catch is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/commit-catch.svg
          git commit -m "chore: refresh Commit Catch [skip ci]"
          git push

