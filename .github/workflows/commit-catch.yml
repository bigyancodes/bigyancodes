name: Refresh Contribution Art

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5

      - name: Generate the original contribution animations
        run: |
          node scripts/generate-commit-catch.mjs
          node scripts/generate-commit-odyssey.mjs
        env:
          GITHUB_USER: ${{ github.repository_owner }}

      - name: Commit the refreshed animations
        shell: bash
        run: |
          if git diff --quiet -- assets/commit-catch.svg assets/commit-odyssey.svg; then
            echo "Contribution art is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/commit-catch.svg assets/commit-odyssey.svg
          git commit -m "chore: refresh contribution art [skip ci]"
          git push
